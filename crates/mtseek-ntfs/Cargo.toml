[package]
name = "mtseek-ntfs"
description = "NTFS master file table enumeration and USN change journal reading."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

# This crate holds the project's only `unsafe` code (Win32 FFI), so it cannot inherit the
# workspace's `unsafe_code = "forbid"`. It denies unsafe everywhere and allows it only in
# `src/sys.rs`. Everything else mirrors [workspace.lints]; keep the two in sync.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
